<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Block Stacker</title>
<meta name="theme-color" content="#2b2b2b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="console">
    <div id="screen-bezel">
      <div id="screen">
        <canvas id="board" width="240" height="480"></canvas>
        <div id="overlay">
          <div id="overlay-text"></div>
          <button id="startBtn">Start</button>
        </div>
      </div>
      <div id="hud">
        <div class="hud-box">SCORE<br><span id="score">0</span></div>
        <div class="hud-box">STAGE<br><span id="level">1</span></div>
        <div class="hud-box">LINES<br><span id="lines">0</span></div>
        <div class="hud-box">NEXT<br><canvas id="next" width="80" height="80"></canvas></div>
      </div>
    </div>

    <div id="controls">
      <div id="pad-row">
        <div id="dpad">
          <button id="btnUp" class="ctrl-btn dpad-btn" aria-label="Up">▲</button>
          <button id="btnLeft" class="ctrl-btn dpad-btn" aria-label="Left">◀</button>
          <div class="dpad-center"></div>
          <button id="btnRight" class="ctrl-btn dpad-btn" aria-label="Right">▶</button>
          <button id="btnDown" class="ctrl-btn dpad-btn" aria-label="Down">▼</button>
        </div>
        <div id="action-buttons">
          <button id="btnRotate" class="ctrl-btn round">A</button>
          <button id="btnDrop" class="ctrl-btn round">B</button>
        </div>
      </div>
      <div id="meta-buttons">
        <button id="btnSelect" class="ctrl-btn pill">SELECT</button>
        <button id="btnPause" class="ctrl-btn pill">START</button>
      </div>
    </div>
  </div>

<script src="game.js"></script>
</body>
</html>
